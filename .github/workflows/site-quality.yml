name: Site Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-metadata:
    name: SEO metadata freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify SEO metadata and sitemap are up to date
        run: node scripts/seo-meta-manager.mjs --check

  internal-links:
    name: Internal link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check internal links (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --root-dir ${{ github.workspace }}
            --no-progress
            "./**/*.html"
          fail: true

  lighthouse:
    name: Lighthouse (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
