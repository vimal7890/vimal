        /* Brand colours (Substack orange, LinkedIn blue). In dark mode every link hovers to the accent. */
        .social-link {

        .social-link:hover {

        }
        .social-link svg {

            height: 20px;
        }
        .linkedin-link {
            --social: #0a66c2;
            --social-hover: #004182;
        }
        .email-link {
            --social: var(--muted);
            --social-hover: #222222;
        }
        @media (prefers-color-scheme: dark) {
            .social-link {
                --social: #ff802b;
                --social-hover: var(--accent);
            }
            .linkedin-link {
                --social: #4da3ff;
            }
            .email-link {
                --social: var(--muted);
            }
        }
        @media (max-width: 640px) {
            .container {
                padding: 14px;
            }

    <script>
        (function () {
            var title = document.getElementById('name-title');
            var names = ['Vimal', 'விமல்'];
            var nameIndex = 0, nameTimer = null;
            function startNames() {
                if (nameTimer) return;
                nameTimer = setInterval(function () {
                    title.classList.add('fade');
                    setTimeout(function () {
                        nameIndex = (nameIndex + 1) % names.length;
                        title.textContent = names[nameIndex];
                        title.classList.remove('fade');
                    }, 500);
                }, 2000);
            }
            if (title && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                startNames();
                document.addEventListener('visibilitychange', function () {
                    clearInterval(nameTimer);
                    nameTimer = null;
                    if (document.visibilityState === 'visible') startNames();
                });
            }
        })();
    </script>
